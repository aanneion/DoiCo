    input, textarea, select {

<body>
  <div id="root">Loading...</div>
  
  <script type="text/babel" data-type="module">
    const { useState, useCallback, useMemo, useRef, useEffect } = React;
    
    function WhatsAppIcon({ className = "w-4 h-4" }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
      );
    }
    
    const products = [
      {
        id: "cup-doi",
        name: "এক কাপ দই",
        description: "১২৫ গ্রামের এক কাপ ঐতিহ্যবাহী মিষ্টি দই। মাটির ভাঁড়ের স্বাদ।",
        price: 40,
        image: "https://raw.githubusercontent.com/aanneion/DoiCo/doico-bangla-landing-page-94852/public/images/cup.jpg",
        available: true,
      },
      {
        id: "sora-doi",
        name: "১ পট/সরা দই",
        description: "১ কেজি ওজনের মাটির সরায় ঐতিহ্যবাহী দই। পরিবারের জন্য আদর্শ।",
        price: 500,
        image: "https://raw.githubusercontent.com/aanneion/DoiCo/doico-bangla-landing-page-94852/public/images/sora.jpg",
        gallery: [
          "https://raw.githubusercontent.com/aanneion/DoiCo/doico-bangla-landing-page-94852/public/images/sora.jpg",
          "https://raw.githubusercontent.com/aanneion/DoiCo/doico-bangla-landing-page-94852/public/images/sora%202.jpg"
        ],
        available: true,
      },
    ];
    
    const CONFIG = {
      GOOGLE_SHEETS_URL: "https://script.google.com/macros/s/AKfycbyk89ANqAESSmIwNK8oz7a1U9zkHuOG8LNAK4CXt1vrcdj0eMfPSSPGMkpTW0OW4XOSuw/exec",
    };
    
    const DELIVERY_CHARGES = {
      "dhaka-inside": 60,
      "dhaka-outside": 120,
      "bau-area": 0,
    };
    
    function formatPrice(amount) {
      return `৳${amount}`;
    }
    
    function App() {
      const [quantities, setQuantities] = useState({});
      const [deliveryArea, setDeliveryArea] = useState("dhaka-inside");
      const [customerName, setCustomerName] = useState("");
      const [phone, setPhone] = useState("");
      const [address, setAddress] = useState("");
      const [step, setStep] = useState("browse");
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [orderId, setOrderId] = useState();
      const [errors, setErrors] = useState({});
      
      const productsRef = useRef(null);
      const orderSectionRef = useRef(null);
      
      const orderItems = useMemo(() => {
        return products
          .filter((p) => (quantities[p.id] || 0) > 0)
          .map((p) => ({ productId: p.id, name: p.name, price: p.price, quantity: quantities[p.id] }));
      }, [quantities]);
      
      const subtotal = useMemo(() => orderItems.reduce((s, i) => s + i.price * i.quantity, 0), [orderItems]);
      const deliveryCharge = DELIVERY_CHARGES[deliveryArea];
      const total = subtotal + deliveryCharge;
      const totalItems = useMemo(() => orderItems.reduce((s, i) => s + i.quantity, 0), [orderItems]);
      
      const handleQuantityChange = useCallback((productId, quantity) => {
        setQuantities((prev) => {
          const next = { ...prev };
          if (quantity === 0) delete next[productId];
          else next[productId] = quantity;
          return next;
        });
      }, []);
      
      const scrollToProducts = useCallback(() => productsRef.current?.scrollIntoView({ behavior: "smooth" }), []);
      const scrollToOrder = useCallback(() => orderSectionRef.current?.scrollIntoView({ behavior: "smooth" }), []);
      
      const handleSubmitOrder = useCallback(async () => {
        const validationErrors = {};
        if (!customerName.trim()) validationErrors.customerName = "আপনার নাম লিখুন।";
        const cleaned = phone.replace(/[\s-]/g, "");
        if (!cleaned) validationErrors.phone = "মোবাইল নম্বর দিন।";
        else if (!/^01[3-9]\d{8}$/.test(cleaned)) validationErrors.phone = "সঠিক মোবাইল নম্বর দিন।";
        if (!address.trim()) validationErrors.address = "আপনার ঠিকানা লিখুন।";
        if (orderItems.length === 0) validationErrors.items = "কমপক্ষে একটি পণ্য নির্বাচন করুন।";
        
        if (Object.keys(validationErrors).length > 0) {
          setErrors(validationErrors);
          return;
        }
        
        setErrors({});
        setIsSubmitting(true);
        
        try {
          const newOrderId = `DC-${Date.now().toString(36).toUpperCase()}`;
          const timestamp = new Date().toISOString();
          
          const order = {
            customerName, phone, address, deliveryArea,
            items: orderItems, subtotal, deliveryCharge, total,
            orderId: newOrderId, timestamp,
          };
          const existingOrders = JSON.parse(localStorage.getItem("doico_orders") || "[]");
          existingOrders.push(order);
          localStorage.setItem("doico_orders", JSON.stringify(existingOrders));
          
          if (CONFIG.GOOGLE_SHEETS_URL) {
            const deliveryAreaText = deliveryArea === "dhaka-inside" ? "ঢাকার ভিতরে" : deliveryArea === "dhaka-outside" ? "ঢাকার বাইরে" : "বাকৃবি এলাকা";
            await fetch(CONFIG.GOOGLE_SHEETS_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                orderId: newOrderId,
                timestamp,
                customerName,
                phone,
                address,
                deliveryArea: deliveryAreaText,
                items: orderItems.map(i => `${i.name} x${i.quantity}`).join(", "),
                subtotal,
                deliveryCharge,
                total,
              }),
            });
          }
          
          setOrderId(newOrderId);
          setStep("success");
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (error) {
          setErrors({ submit: "অর্ডার পাঠাতে সমস্যা হয়েছে।" });
        } finally {
          setIsSubmitting(false);
        }
      }, [customerName, phone, address, deliveryArea, orderItems, subtotal, deliveryCharge, total]);
      
      const handleNewOrder = useCallback(() => {
        setQuantities({});
        setCustomerName("");
        setPhone("");
        setAddress("");
        setStep("browse");
        setOrderId(undefined);
        setErrors({});
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, []);
      
      return (
        <div className="min-h-screen bg-amber-50/30">
          <header className="fixed top-0 left-0 right-0 z-50 bg-amber-50/95 backdrop-blur-sm border-b border-amber-100">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🍶</span>
                <div>
                  <h1 className="text-lg font-bold text-stone-800 leading-tight">দইকো বাংলাদেশ</h1>
                  <p className="text-xs text-stone-500 leading-tight hidden sm:block">বগুড়ার দইয়ের নতুন ঠিকানা</p>
                </div>
              </div>
              <a href="https://wa.me/8801623858009" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1.5 bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition-colors">
                <WhatsAppIcon className="w-4 h-4" />
                <span className="hidden sm:inline">WhatsApp</span>
              </a>
            </div>
          </header>
          
          <div className="h-14" />
          
          {step === "browse" && (
            <>
              <section className="relative min-h-[85vh] sm:min-h-[90vh] flex items-center overflow-hidden">
                <div className="absolute inset-0">
                  <img src="https://raw.githubusercontent.com/aanneion/DoiCo/doico-bangla-landing-page-94852/public/images/banner.jpg" alt="দইকো বাংলাদেশ" className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-b from-stone-900/70 via-stone-900/50 to-stone-900/80" />
                </div>
                <div className="relative z-10 max-w-6xl mx-auto px-4 py-20 sm:py-28 text-center">
                  <div className="animate-fade-in-up">
                    <p className="text-amber-200 text-sm sm:text-base font-medium tracking-wide mb-3">বগুড়ার গর্ব, আপনার টেবিলে</p>
                    <h2 className="text-4xl sm:text-5xl md:text-6xl font-extrabold text-white mb-4 leading-tight">দইকো বাংলাদেশ</h2>
                    <p className="text-xl sm:text-2xl md:text-3xl text-amber-100 font-semibold mb-4">বগুড়ার দইয়ের নতুন ঠিকানা</p>
                    <p className="text-base sm:text-lg text-amber-50/90 max-w-xl mx-auto mb-8 leading-relaxed">ঐতিহ্যবাহী স্বাদ, মানসম্মত প্রস্তুতি এবং প্রতিদিনের সতেজতা।</p>
                  </div>
                  <div className="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 animate-fade-in-up stagger-2">
                    <button onClick={scrollToProducts} className="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-white font-bold text-lg px-8 py-4 rounded-xl shadow-lg transition-all hover:scale-105 active:scale-95">এখনই অর্ডার করুন</button>
                  </div>
                </div>
              </section>
              
              <section ref={productsRef} className="py-16 sm:py-20 px-4 bg-white">
                <div className="max-w-6xl mx-auto">
                  <div className="text-center mb-10">
                    <h2 className="text-2xl sm:text-3xl font-bold text-stone-800 mb-2">আমাদের দই</h2>
                    <p className="text-stone-500">আপনার পছন্দের দই বেছে নিন</p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6 max-w-3xl mx-auto">
                    {products.map((product) => {
                      const qty = quantities[product.id] || 0;
                      const images = product.gallery || [product.image];
                      const [currentImageIndex, setCurrentImageIndex] = useState(0);
                      
                      return (
                        <div key={product.id} className="bg-white rounded-2xl shadow-sm border border-amber-100 overflow-hidden transition-all hover:shadow-md">
                          <div className="relative aspect-square overflow-hidden bg-amber-50">
                            <img src={images[currentImageIndex]} alt={product.name} className="w-full h-full object-cover transition-transform duration-500 hover:scale-105" />
                            {qty > 0 && (
                              <div className="absolute top-3 right-3 bg-amber-700 text-white text-xs font-bold px-2 py-1 rounded-full">{qty}টি</div>
                            )}
                            {images.length > 1 && (
                              <>
                                <button onClick={() => setCurrentImageIndex((prev) => (prev === 0 ? images.length - 1 : prev - 1))} className="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-white/80 hover:bg-white rounded-full flex items-center justify-center shadow-md">
                                  <svg className="w-4 h-4 text-stone-700 rotate-[-90deg]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 15l7-7 7 7" /></svg>
                                </button>
                                <button onClick={() => setCurrentImageIndex((prev) => (prev === images.length - 1 ? 0 : prev + 1))} className="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-white/80 hover:bg-white rounded-full flex items-center justify-center shadow-md">
                                  <svg className="w-4 h-4 text-stone-700 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 15l7-7 7 7" /></svg>
                                </button>
                              </>
                            )}
                          </div>
                          <div className="p-4">
                            <h3 className="font-bold text-stone-800 text-base mb-1">{product.name}</h3>
                            <p className="text-sm text-stone-500 mb-3 line-clamp-2 leading-relaxed">{product.description}</p>
                            <div className="flex items-center justify-between">
                              <span className="text-lg font-bold text-amber-800">{formatPrice(product.price)}</span>
                              {qty === 0 ? (
                                <button onClick={() => handleQuantityChange(product.id, 1)} className="flex items-center gap-1.5 bg-amber-700 hover:bg-amber-800 text-white text-sm font-medium px-3 py-2 rounded-lg transition-colors active:scale-95">
                                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                  যোগ করুন
                                </button>
                              ) : (
                                <div className="flex items-center gap-1 bg-amber-50 rounded-lg p-1">
                                  <button onClick={() => handleQuantityChange(product.id, qty - 1)} className="w-9 h-9 flex items-center justify-center rounded-md bg-white shadow-sm hover:bg-amber-100 transition-colors">
                                    <svg className="w-4 h-4 text-stone-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 12H4" /></svg>
                                  </button>
                                  <span className="w-8 text-center font-semibold text-stone-800 text-sm">{qty}</span>
                                  <button onClick={() => handleQuantityChange(product.id, qty + 1)} className="w-9 h-9 flex items-center justify-center rounded-md bg-white shadow-sm hover:bg-amber-100 transition-colors">
                                    <svg className="w-4 h-4 text-stone-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                                  </button>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </section>
              
              {totalItems > 0 && (
                <section ref={orderSectionRef} className="py-12 sm:py-16 px-4">
                  <div className="max-w-2xl mx-auto space-y-5">
                    <div className="text-center mb-8">
                      <h2 className="text-2xl sm:text-3xl font-bold text-stone-800 mb-2">অর্ডার সম্পূর্ণ করুন</h2>
                      <p className="text-stone-500">আপনার তথ্য দিন এবং অর্ডার নিশ্চিত করুন</p>
                    </div>
                    
                    <div className="bg-amber-800 rounded-xl p-5 text-center">
                      <p className="text-amber-200 text-sm mb-1">সর্বমোট</p>
                      <p className="text-3xl font-extrabold text-white">{formatPrice(total)}</p>
                    </div>
                    
                    <div className="bg-white rounded-2xl border border-amber-100 shadow-sm overflow-hidden">
                      <div className="bg-amber-50 px-5 py-3 border-b border-amber-100">
                        <h3 className="font-bold text-stone-800">আপনার তথ্য</h3>
                      </div>
                      <div className="p-5 space-y-4">
                        <div>
                          <label htmlFor="name" className="text-sm font-medium text-stone-700 mb-1.5 block">নাম *</label>
                          <input id="name" type="text" value={customerName} onChange={(e) => { setCustomerName(e.target.value); setErrors((prev) => ({ ...prev, customerName: undefined })); }} placeholder="আপনার নাম লিখুন" className={`w-full px-4 py-3 rounded-xl border ${errors.customerName ? "border-red-300 bg-red-50" : "border-amber-200"} focus:border-amber-500 outline-none text-stone-800`} />
                          {errors.customerName && <p className="text-sm text-red-600 mt-1">{errors.customerName}</p>}
                        </div>
                        <div>
                          <label htmlFor="phone" className="text-sm font-medium text-stone-700 mb-1.5 block">মোবাইল নম্বর *</label>
                          <input id="phone" type="tel" value={phone} onChange={(e) => { setPhone(e.target.value); setErrors((prev) => ({ ...prev, phone: undefined })); }} placeholder="01XXXXXXXXX" dir="ltr" className={`w-full px-4 py-3 rounded-xl border ${errors.phone ? "border-red-300 bg-red-50" : "border-amber-200"} focus:border-amber-500 outline-none text-stone-800`} />
                          {errors.phone && <p className="text-sm text-red-600 mt-1">{errors.phone}</p>}
                        </div>
                        <div>
                          <label htmlFor="address" className="text-sm font-medium text-stone-700 mb-1.5 block">ঠিকানা *</label>
                          <textarea id="address" value={address} onChange={(e) => { setAddress(e.target.value); setErrors((prev) => ({ ...prev, address: undefined })); }} placeholder="আপনার সম্পূর্ণ ঠিকানা লিখুন" rows={3} className={`w-full px-4 py-3 rounded-xl border ${errors.address ? "border-red-300 bg-red-50" : "border-amber-200"} focus:border-amber-500 outline-none text-stone-800 resize-none`} />
                          {errors.address && <p className="text-sm text-red-600 mt-1">{errors.address}</p>}
                        </div>
                      </div>
                    </div>
                    
                    {errors.items && <p className="text-sm text-red-600 bg-red-50 p-3 rounded-xl">{errors.items}</p>}
                    {errors.submit && <p className="text-sm text-red-600 bg-red-50 p-3 rounded-xl">{errors.submit}</p>}
                    
                    <button onClick={handleSubmitOrder} disabled={isSubmitting} className="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold text-lg py-4 rounded-xl shadow-lg transition-all active:scale-[0.98] disabled:opacity-70 flex items-center justify-center gap-2">
                      {isSubmitting ? "পাঠানো হচ্ছে..." : `অর্ডার নিশ্চিত করুন — ${formatPrice(total)}`}
                    </button>
                  </div>
                </section>
              )}
            </>
          )}
          
          {step === "success" && (
            <section className="py-16 px-4">
              <div className="max-w-md mx-auto text-center">
                <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                  <svg className="w-10 h-10 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <h2 className="text-2xl font-bold text-stone-800 mb-3">আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।</h2>
                <p className="text-stone-600 mb-6">আমাদের প্রতিনিধি খুব শিগগিরই আপনার সঙ্গে যোগাযোগ করবেন।</p>
                {orderId && (
                  <div className="bg-amber-50 rounded-xl p-4 mb-6">
                    <p className="text-sm text-stone-500">অর্ডার নম্বর</p>
                    <p className="font-bold text-stone-800 text-lg" dir="ltr">{orderId}</p>
                  </div>
                )}
                <button onClick={handleNewOrder} className="w-full bg-amber-700 hover:bg-amber-800 text-white font-bold py-4 rounded-xl transition-all active:scale-95">নতুন অর্ডার করুন</button>
              </div>
            </section>
          )}
          
          <footer className="bg-stone-800 text-amber-50 py-12 px-4">
            <div className="max-w-6xl mx-auto text-center">
              <div className="flex items-center justify-center gap-2 mb-3">
                <span className="text-2xl">🍶</span>
                <h3 className="text-xl font-bold text-white">দইকো বাংলাদেশ</h3>
              </div>
              <p className="text-amber-100 text-sm mb-4">বগুড়ার দইয়ের নতুন ঠিকানা</p>
              <div className="flex flex-col sm:flex-row items-center justify-center gap-4 text-sm">
                <a href="https://wa.me/8801623858009" target="_blank" rel="noopener noreferrer" className="flex items-center gap-2 text-amber-100 hover:text-white">
                  <WhatsAppIcon className="w-4 h-4" /> 01623-858009
                </a>
                <a href="mailto:doicobangladesh@gmail.com" className="text-amber-100 hover:text-white">doicobangladesh@gmail.com</a>
              </div>
              <p className="text-xs text-amber-300 mt-6">© {new Date().getFullYear()} দইকো বাংলাদেশ। সর্বস্বত্ব সংরক্ষিত।</p>
            </div>
          </footer>
        </div>
      );
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
