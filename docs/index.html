<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>দইকো বাংলাদেশ | বগুড়ার দইয়ের নতুন ঠিকানা</title>
  <meta name="description" content="ঐতিহ্যবাহী স্বাদ, মানসম্মত প্রস্তুতি এবং প্রতিদিনের সতেজতা। বগুড়ার গর্ব, আপনার টেবিলে।">
  <meta property="og:title" content="দইকো বাংলাদেশ | বগুড়ার দইয়ের নতুন ঠিকানা">
  <meta property="og:description" content="ঐতিহ্যবাহী স্বাদ, মানসম্মত প্রস্তুতি এবং প্রতিদিনের সতেজতা। বগুড়ার গর্ব, আপনার টেবিলে।">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://raw.githubusercontent.com/aanneion/DoiCo/main/public/images/banner.jpg">
  <meta property="og:locale" content="bn_BD">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Google Fonts - Noto Sans Bengali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; }
    body {
      font-family: 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #fefdf8;
      color: #2d1810;
      line-height: 1.7;
    }
    #root { min-height: 100vh; }
    
    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .animate-spin { animation: spin 1s linear infinite; }
    .stagger-1 { opacity: 0; animation-delay: 0.1s; }
    .stagger-2 { opacity: 0; animation-delay: 0.2s; }
    .stagger-3 { opacity: 0; animation-delay: 0.3s; }
    .stagger-4 { opacity: 0; animation-delay: 0.4s; }
    
    /* Line clamp */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #fdf9e8; }
    ::-webkit-scrollbar-thumb { background: #e8bc9e; border-radius: 3px; }
    
    /* Focus styles */
    *:focus-visible {
      outline: 2px solid #d07a4e;
      outline-offset: 2px;
      border-radius: 4px;
    }
    
    /* Safe area */
    .safe-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    
    /* Input styling */
    input, textarea, select {
      font-family: 'Noto Sans Bengali', system-ui, sans-serif;
      font-size: 16px;
    }
    
    /* Better touch targets */
    @media (pointer: coarse) {
      button, a, [role="button"] {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useCallback, useMemo, useRef, useEffect } = React;
    
    // WhatsApp Icon Component
    function WhatsAppIcon({ className = "w-4 h-4" }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
      );
    }
    
    // Products Data
    const products = [
      {
        id: "cup-doi",
        name: "এক কাপ দই",
        description: "১২৫ গ্রামের এক কাপ ঐতিহ্যবাহী মিষ্টি দই। মাটির ভাঁড়ের স্বাদ।",
        price: 40,
        image: "https://raw.githubusercontent.com/aanneion/DoiCo/main/public/images/cup.jpg",
        available: true,
      },
      {
        id: "sora-doi",
        name: "১ পট/সরা দই",
        description: "১ কেজি ওজনের মাটির সরায় ঐতিহ্যবাহী দই। পরিবারের জন্য আদর্শ।",
        price: 500,
        image: "https://raw.githubusercontent.com/aanneion/DoiCo/main/public/images/sora.jpg",
        gallery: [
          "https://raw.githubusercontent.com/aanneion/DoiCo/main/public/images/sora.jpg",
          "https://raw.githubusercontent.com/aanneion/DoiCo/main/public/images/sora%202.jpg"
        ],
        available: true,
      },
    ];
    
    // Configuration
    const CONFIG = {
      GOOGLE_SHEETS_URL: "https://script.google.com/macros/s/AKfycbyk89ANqAESSmIwNK8oz7a1U9zkHuOG8LNAK4CXt1vrcdj0eMfPSSPGMkpTW0OW4XOSuw/exec",
      EMAIL_SERVICE_ID: "service_doico",
      EMAIL_TEMPLATE_ID: "template_doico",
      EMAIL_PUBLIC_KEY: "YOUR_PUBLIC_KEY",
      EMAIL_TO: "doicobangladesh@gmail.com",
    };
    
    const DELIVERY_CHARGES = {
      "dhaka-inside": 60,
      "dhaka-outside": 120,
      "bau-area": 0,
    };
    
    function formatPrice(amount) {
      return `৳${amount}`;
    }
    
    // Main App Component
    function App() {
      const [quantities, setQuantities] = useState({});
      const [deliveryArea, setDeliveryArea] = useState("dhaka-inside");
      const [customerName, setCustomerName] = useState("");
      const [phone, setPhone] = useState("");
      const [address, setAddress] = useState("");
      const [step, setStep] = useState("browse");
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [orderId, setOrderId] = useState();
      const [errors, setErrors] = useState({});
      const [showScrollTop, setShowScrollTop] = useState(false);
      
      const productsRef = useRef(null);
      const orderSectionRef = useRef(null);
      
      // Computed values
      const orderItems = useMemo(() => {
        return products
          .filter((p) => (quantities[p.id] || 0) > 0)
          .map((p) => ({ productId: p.id, name: p.name, price: p.price, quantity: quantities[p.id] }));
      }, [quantities]);
      
      const subtotal = useMemo(() => orderItems.reduce((s, i) => s + i.price * i.quantity, 0), [orderItems]);
      const deliveryCharge = DELIVERY_CHARGES[deliveryArea];
      const total = subtotal + deliveryCharge;
      const totalItems = useMemo(() => orderItems.reduce((s, i) => s + i.quantity, 0), [orderItems]);
      
      // Handlers
      const handleQuantityChange = useCallback((productId, quantity) => {
        setQuantities((prev) => {
          const next = { ...prev };
          if (quantity === 0) delete next[productId];
          else next[productId] = quantity;
          return next;
        });
      }, []);
      
      const scrollToProducts = useCallback(() => productsRef.current?.scrollIntoView({ behavior: "smooth" }), []);
      const scrollToOrder = useCallback(() => orderSectionRef.current?.scrollIntoView({ behavior: "smooth" }), []);
      
      const handleSubmitOrder = useCallback(async () => {
        const validationErrors = {};
        if (!customerName.trim()) validationErrors.customerName = "আপনার নাম লিখুন।";
        const cleaned = phone.replace(/[\s-]/g, "");
        if (!cleaned) validationErrors.phone = "মোবাইল নম্বর দিন।";
        else if (!/^01[3-9]\d{8}$/.test(cleaned)) validationErrors.phone = "সঠিক মোবাইল নম্বর দিন। (০১XXXXXXXXX)";
        if (!address.trim()) validationErrors.address = "আপনার ঠিকানা লিখুন।";
        if (orderItems.length === 0) validationErrors.items = "কমপক্ষে একটি পণ্য নির্বাচন করুন।";
        
        if (Object.keys(validationErrors).length > 0) {
          setErrors(validationErrors);
          return;
        }
        
        setErrors({});
        setIsSubmitting(true);
        
        try {
          const newOrderId = `DC-${Date.now().toString(36).toUpperCase()}`;
          const timestamp = new Date().toISOString();
          
          // Save to localStorage
          const order = {
            customerName, phone, address, deliveryArea,
            items: orderItems, subtotal, deliveryCharge, total,
            orderId: newOrderId, timestamp,
          };
          const existingOrders = JSON.parse(localStorage.getItem("doico_orders") || "[]");
          existingOrders.push(order);
          localStorage.setItem("doico_orders", JSON.stringify(existingOrders));
          
          // Send to Google Sheets
          if (CONFIG.GOOGLE_SHEETS_URL) {
            const deliveryAreaText = deliveryArea === "dhaka-inside" ? "ঢাকার ভিতরে" : deliveryArea === "dhaka-outside" ? "ঢাকার বাইরে" : "বাকৃবি এলাকা";
            await fetch(CONFIG.GOOGLE_SHEETS_URL, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                orderId: newOrderId,
                timestamp,
                customerName,
                phone,
                address,
                deliveryArea: deliveryAreaText,
                items: orderItems.map(i => `${i.name} x${i.quantity}`).join(", "),
                subtotal,
                deliveryCharge,
                total,
              }),
            });
          }
          
          setOrderId(newOrderId);
          setStep("success");
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (error) {
          setErrors({ submit: "অর্ডার পাঠাতে সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।" });
        } finally {
          setIsSubmitting(false);
        }
      }, [customerName, phone, address, deliveryArea, orderItems, subtotal, deliveryCharge, total]);
      
      const handleNewOrder = useCallback(() => {
        setQuantities({});
        setCustomerName("");
        setPhone("");
        setAddress("");
        setStep("browse");
        setOrderId(undefined);
        setErrors({});
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, []);
      
      // Scroll listener
      useEffect(() => {
        const handleScroll = () => setShowScrollTop(window.scrollY > 400);
        window.addEventListener("scroll", handleScroll, { passive: true });
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);
      
      return (
        <div className="min-h-screen bg-amber-50/30">
          {/* Header */}
          <header className="fixed top-0 left-0 right-0 z-50 bg-amber-50/95 backdrop-blur-sm border-b border-amber-100">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🍶</span>
                <div>
                  <h1 className="text-lg font-bold text-stone-800 leading-tight">দইকো বাংলাদেশ</h1>
                  <p className="text-xs text-stone-500 leading-tight hidden sm:block">বগুড়ার দইয়ের নতুন ঠিকানা</p>
                </div>
              </div>
              <a href="https://wa.me/8801623858009" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1.5 bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm font-medium transition-colors" aria-label="WhatsApp করুন">
                <WhatsAppIcon className="w-4 h-4" />
                <span className="hidden sm:inline">WhatsApp</span>
              </a>
            </div>
          </header>
          
          <div className="h-14" />
          
          {step === "browse" && (
            <>
              {/* Hero */}
              <section className="relative min-h-[85vh] sm:min-h-[90vh] flex items-center overflow-hidden">
                <div className="absolute inset-0">
                  <img src="https://raw.githubusercontent.com/aanneion/DoiCo/main/public/images/banner.jpg" alt="দইকো বাংলাদেশ - বগুড়ার দই" className="w-full h-full object-cover" loading="eager" />
                  <div className="absolute inset-0 bg-gradient-to-b from-stone-900/70 via-stone-900/50 to-stone-900/80" />
                </div>
                <div className="relative z-10 max-w-6xl mx-auto px-4 py-20 sm:py-28 text-center">
                  <div className="animate-fade-in-up">
                    <p className="text-amber-200 text-sm sm:text-base font-medium tracking-wide mb-3">বগুড়ার গর্ব, আপনার টেবিলে</p>
                    <h2 className="text-4xl sm:text-5xl md:text-6xl font-extrabold text-white mb-4 leading-tight">দইকো বাংলাদেশ</h2>
                    <p className="text-xl sm:text-2xl md:text-3xl text-amber-100 font-semibold mb-4">বগুড়ার দইয়ের নতুন ঠিকানা</p>
                    <p className="text-base sm:text-lg text-amber-50/90 max-w-xl mx-auto mb-8 leading-relaxed">ঐতিহ্যবাহী স্বাদ, মানসম্মত প্রস্তুতি এবং প্রতিদিনের সতেজতা।</p>
                  </div>
                  <div className="flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-4 animate-fade-in-up stagger-2">
                    <button onClick={scrollToOrder} className="w-full sm:w-auto bg-amber-500 hover:bg-amber-600 text-white font-bold text-lg px-8 py-4 rounded-xl shadow-lg shadow-amber-500/30 transition-all hover:scale-105 active:scale-95">এখনই অর্ডার করুন</button>
                    <button onClick={scrollToProducts} className="w-full sm:w-auto bg-white/15 hover:bg-white/25 text-white font-semibold text-lg px-8 py-4 rounded-xl border border-white/30 backdrop-blur-sm transition-all">দই দেখুন</button>
                  </div>
                </div>
                <div className="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-amber-50/30 to-transparent" />
              </section>
              
              {/* Products */}
              <section ref={productsRef} className="py-16 sm:py-20 px-4 bg-white">
                <div className="max-w-6xl mx-auto">
                  <div className="text-center mb-10">
                    <h2 className="text-2xl sm:text-3xl font-bold text-stone-800 mb-2">আমাদের দই</h2>
                    <p className="text-stone-500">আপনার পছন্দের দই বেছে নিন</p>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6 max-w-3xl mx-auto">
                    {products.map((product) => {
                      const qty = quantities[product.id] || 0;
                      const images = product.gallery || [product.image];
                      const [currentImageIndex, setCurrentImageIndex] = useState(0);
                      
                      return (
                        <div key={product.id} className="bg-white rounded-2xl shadow-sm border border-amber-100 overflow-hidden transition-all hover:shadow-md">
                          <div className="relative aspect-square overflow-hidden bg-amber-50">
                            <img src={images[currentImageIndex]} alt={product.name} className="w-full h-full object-cover transition-transform duration-500 hover:scale-105" loading="lazy" />
                            {qty > 0 && (
                              <div className="absolute top-3 right-3 bg-amber-700 text-white text-xs font-bold px-2 py-1 rounded-full">{qty}টি</div>
                            )}
                            {images.length > 1 && (
                              <>
                                <button onClick={() => setCurrentImageIndex((prev) => (prev === 0 ? images.length - 1 : prev - 1))} className="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-white/80 hover:bg-white rounded-full flex items-center justify-center shadow-md transition-all" aria-label="আগের ছবি">
                                  <svg className="w-4 h-4 text-stone-700 rotate-[-90deg]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 15l7-7 7 7" /></svg>
                                </button>
                                <button onClick={() => setCurrentImageIndex((prev) => (prev === images.length - 1 ? 0 : prev + 1))} className="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-white/80 hover:bg-white rounded-full flex items-center justify-center shadow-md transition-all" aria-label="পরের ছবি">
                                  <svg className="w-4 h-4 text-stone-700 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 15l7-7 7 7" /></svg>
                                </button>
                                <div className="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1">
                                  {images.map((_, idx) => (
                                    <button key={idx} onClick={() => setCurrentImageIndex(idx)} className={`w-2 h-2 rounded-full transition-all ${idx === currentImageIndex ? "bg-white w-6" : "bg-white/50"}`} aria-label={`ছবি ${idx + 1}`} />
                                  ))}
                                </div>
                              </>
                            )}
                          </div>
                          <div className="p-4">
                            <h3 className="font-bold text-stone-800 text-base mb-1">{product.name}</h3>
                            <p className="text-sm text-stone-500 mb-3 line-clamp-2 leading-relaxed">{product.description}</p>
                            <div className="flex items-center justify-between">
                              <span className="text-lg font-bold text-amber-800">{formatPrice(product.price)}</span>
                              {qty === 0 ? (
                                <button onClick={() => handleQuantityChange(product.id, 1)} className="flex items-center gap-1.5 bg-amber-700 hover:bg-amber-800 text-white text-sm font-medium px-3 py-2 rounded-lg transition-colors active:scale-95">
                                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                  যোগ করুন
                                </button>
                              ) : (
                                <div className="flex items-center gap-1 bg-amber-50 rounded-lg p-1">
                                  <button onClick={() => handleQuantityChange(product.id, qty - 1)} className="w-9 h-9 flex items-center justify-center rounded-md bg-white shadow-sm hover:bg-amber-100 active:bg-amber-200 transition-colors" aria-label="পরিমাণ কমান">
                                    <svg className="w-4 h-4 text-stone-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20 12H4" /></svg>
                                  </button>
                                  <span className="w-8 text-center font-semibold text-stone-800 text-sm">{qty}</span>
                                  <button onClick={() => handleQuantityChange(product.id, qty + 1)} className="w-9 h-9 flex items-center justify-center rounded-md bg-white shadow-sm hover:bg-amber-100 active:bg-amber-200 transition-colors" aria-label="পরিমাণ বাড়ান">
                                    <svg className="w-4 h-4 text-stone-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                                  </button>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </section>
              
              {/* Order Section */}
              {totalItems > 0 && (
                <section ref={orderSectionRef} className="py-12 sm:py-16 px-4">
                  <div className="max-w-2xl mx-auto space-y-5">
                    <div className="text-center mb-8">
                      <h2 className="text-2xl sm:text-3xl font-bold text-stone-800 mb-2">অর্ডার সম্পূর্ণ করুন</h2>
                      <p className="text-stone-500">আপনার তথ্য দিন এবং অর্ডার নিশ্চিত করুন</p>
                    </div>
